{% extends "base.html" %}
{% block title %}Register — AgentCare{% endblock %}
{% block content %}
<div class="auth-shell">
  <div class="card">
    <h1>Create your account</h1>
    <span class="subtitle text-muted">Patient registration</span>

    {% if error %}
      <div class="flash flash-error">{{ error }}</div>
    {% endif %}

    <form method="post" action="/register">
      <div class="field">
        <label for="name">Full name</label>
        <input type="text" id="name" name="name" required autofocus>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" minlength="8" required>
        <div class="help-text">At least 8 characters.</div>
      </div>
      <div class="field">
        <label for="phone">Phone (optional)</label>
        <input type="text" id="phone" name="phone">
      </div>
      <div class="field">
        <label for="date_of_birth">Date of birth (optional)</label>
        <input type="date" id="date_of_birth" name="date_of_birth">
      </div>
      <div class="field">
        <label for="emergency_contact">Emergency contact (optional)</label>
        <input type="text" id="emergency_contact" name="emergency_contact" placeholder="Name, phone number">
      </div>
      <button type="submit" class="btn" style="width:100%">Create account</button>
    </form>

    <p class="help-text" style="margin-top:1rem; text-align:center;">
      Already have an account? <a href="/login">Log in</a>
    </p>
  </div>
</div>
{% endblock %}
